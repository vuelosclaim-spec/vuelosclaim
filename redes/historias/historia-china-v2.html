<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:I;src:url(file:///usr/share/fonts/opentype/inter/Inter-Black.otf);font-weight:900}
@font-face{font-family:I;src:url(file:///usr/share/fonts/opentype/inter/Inter-ExtraBold.otf);font-weight:800}
@font-face{font-family:I;src:url(file:///usr/share/fonts/opentype/inter/Inter-Bold.otf);font-weight:700}
@font-face{font-family:I;src:url(file:///usr/share/fonts/opentype/inter/Inter-Medium.otf);font-weight:500}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body><canvas id=c width=1080 height=1920></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=1080,H=1920;
const C={bg1:'#071029',bg2:'#13254f',w:'#fff',m:'#a9b6d6',r:'#ef4444',g:'#22c55e',a:'#fbbf24',b:'#3b82f6'};
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const eo=t=>1-Math.pow(1-cl(t),3), eb=t=>{t=cl(t);const s=1.70158;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
function rnd(i){const s=Math.sin(i*127.1)*43758.5453;return s-Math.floor(s)}
function font(w,s){x.font=`${w} ${s}px I`}
function txt(s,X,Y,w,sz,col,al=1,align='center'){x.save();x.globalAlpha=al;font(w,sz);x.fillStyle=col;x.textAlign=align;x.textBaseline='middle';x.fillText(s,X,Y);x.restore()}
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r)}
function bg(t){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,C.bg1);g.addColorStop(1,C.bg2);x.fillStyle=g;x.fillRect(0,0,W,H);
 // drifting light particles
 for(let i=0;i<40;i++){const px=(rnd(i)*W+t*30*(0.3+rnd(i+9)))%W,py=(rnd(i+3)*H-t*20*(0.5+rnd(i+5))+H)%H;x.fillStyle=`rgba(150,180,255,${0.08+0.12*rnd(i+7)})`;x.beginPath();x.arc(px,py,2+4*rnd(i+1),0,7);x.fill()}}
// split flap text
const AL=' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789→';
function flap(s,X,Y,cw,ch,t,col){for(let i=0;i<s.length;i++){const tgt=s[i];const st=cl((t-i*0.04)/0.5);let ch_=tgt;if(st<1){ch_=AL[Math.floor(rnd(i+Math.floor(t*25))*AL.length)]}
 rr(X+i*(cw+6),Y,cw,ch,8);x.fillStyle='#0b1220';x.fill();x.fillStyle='rgba(255,255,255,.06)';x.fillRect(X+i*(cw+6),Y+ch/2-1,cw,2);
 txt(ch_,X+i*(cw+6)+cw/2,Y+ch/2+2,800,ch*0.7,st<1?'#cbd5e1':col)}}
function person(X,Y,s,col,slump,t,i){x.save();x.translate(X,Y+Math.sin(t*6+i)*4*(1-slump));x.rotate(slump*0.12*(i%2?1:-1));x.fillStyle=col;
 x.beginPath();x.arc(0,-s*1.55-slump*s*0.25,s*0.42,0,7);x.fill();rr(-s*0.5,-s*1.05,s,s*1.15,s*0.35);x.fill();
 // suitcase
 if(i%2==0){x.fillStyle='#f59e0b';rr(s*0.6,-s*0.55,s*0.55,s*0.65,8);x.fill()}x.restore()}
function plane(X,Y,ang,s){x.save();x.translate(X,Y);x.rotate(ang);x.fillStyle='#fff';x.beginPath();
 x.moveTo(s,0);x.lineTo(-s*0.6,-s*0.12);x.lineTo(-s*0.75,-s*0.5);x.lineTo(-s*0.9,-s*0.5);x.lineTo(-s*0.8,-s*0.1);x.lineTo(-s,-s*0.08);x.lineTo(-s,s*0.08);x.lineTo(-s*0.8,s*0.1);x.lineTo(-s*0.9,s*0.5);x.lineTo(-s*0.75,s*0.5);x.lineTo(-s*0.6,s*0.12);x.closePath();x.fill();
 x.beginPath();x.moveTo(s*0.15,0);x.lineTo(-s*0.25,-s*0.9);x.lineTo(-s*0.45,-s*0.9);x.lineTo(-s*0.2,0);x.lineTo(-s*0.45,s*0.9);x.lineTo(-s*0.25,s*0.9);x.closePath();x.fill();x.restore()}
function clock(X,Y,r,t,col){x.save();x.translate(X,Y);x.strokeStyle=col;x.lineWidth=10;x.beginPath();x.arc(0,0,r,0,7);x.stroke();
 x.lineCap='round';x.lineWidth=12;x.beginPath();x.moveTo(0,0);const a1=t*9;x.lineTo(Math.sin(a1)*r*0.75,-Math.cos(a1)*r*0.75);x.stroke();
 x.lineWidth=14;x.beginPath();x.moveTo(0,0);const a2=t*0.75;x.lineTo(Math.sin(a2)*r*0.5,-Math.cos(a2)*r*0.5);x.stroke();x.restore()}
function coin(X,Y,r,rot,al){x.save();x.globalAlpha=al;x.translate(X,Y);x.scale(Math.abs(Math.cos(rot))*0.8+0.2,1);x.fillStyle='#facc15';x.beginPath();x.arc(0,0,r,0,7);x.fill();x.strokeStyle='#ca8a04';x.lineWidth=6;x.stroke();x.fillStyle='#a16207';font(900,r*1.1);x.textAlign='center';x.textBaseline='middle';x.fillText('€',0,4);x.restore()}
function eustars(X,Y,R,t){for(let i=0;i<12;i++){const a=i/12*Math.PI*2+t*0.6;star(X+Math.cos(a)*R,Y+Math.sin(a)*R,16,'#facc15')}}
function star(X,Y,r,col){x.save();x.fillStyle=col;x.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr_=i%2?r*0.45:r;x.lineTo(X+Math.cos(a)*rr_,Y+Math.sin(a)*rr_)}x.closePath();x.fill();x.restore()}
function pill(t){const p=1+0.04*Math.sin(t*5);x.save();x.translate(W/2,1690);x.scale(p,p);x.fillStyle=C.b;rr(-250,-50,500,100,50);x.fill();txt('Enlace en la bio ↑',0,2,800,48,'#fff');x.restore();
 txt('Caso hipotético · Reglamento (CE) 261/2004',W/2,1820,500,30,C.m)}
function fadeScene(t,a,b){return cl((t-a)/0.25)*cl((b-t)/0.25)}

function render(t){bg(t);
 txt('vuelosclaim.eu',70,90,700,38,C.m,1,'left');
 // ---- Scene 1: 0-3.4 board + hook
 let A=fadeScene(t,-1,3.4);
 if(A>0){x.save();x.globalAlpha=A;
  rr(60,260,960,420,30);x.fillStyle='#0f1b38';x.fill();
  txt('SALIDAS · LLEGADAS',W/2,315,800,34,C.a);
  flap('PEKIN → MADRID',95,370,60,90,t*1.6,'#fff');
  const blink=t>0.9&&Math.floor(t*4)%2==0;
  flap('RETRASADO',95,500,60,90,t*1.4,blink?'#7f1d1d':C.r);
  txt('+5 H',880,545,900,70,C.r,cl((t-0.7)/0.2));
  const s=eb((t-0.15)/0.45);x.save();x.translate(W/2,860);x.scale(s,s);txt('¿Cuánto dinero',0,-60,900,96,'#fff');txt('os deben?',0,50,900,96,C.a);x.restore();
  for(let i=0;i<4;i++)person(300+i*160,1400,70-(i>1?18:0),['#60a5fa','#f472b6','#34d399','#fbbf24'][i],cl((t-0.9)/0.6),t,i);
  txt('Familia de 4 · vuelta de vacaciones',W/2,1500,700,40,C.m,cl((t-0.4)/0.4));
  x.restore()}
 // ---- Scene 2: 3.4-7.4 flight on map
 A=fadeScene(t,3.4,7.4);
 if(A>0){const lt=t-3.4;x.save();x.globalAlpha=A;
  for(let gx=0;gx<24;gx++)for(let gy=0;gy<22;gy++){const px=40+gx*44,py=420+gy*44;const n=rnd(gx*31+gy*7);if(n>0.45){x.fillStyle=`rgba(96,165,250,${0.15+0.2*n})`;x.beginPath();x.arc(px,py,5,0,7);x.fill()}}
  const P0={x:900,y:760},P1={x:180,y:900},CP={x:540,y:380};
  const k=eo(lt/3.2);x.setLineDash([18,16]);x.lineDashOffset=-lt*60;x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=6;x.beginPath();
  x.moveTo(P0.x,P0.y);for(let i=1;i<=60;i++){const u=i/60*k;const X=(1-u)**2*P0.x+2*(1-u)*u*CP.x+u*u*P1.x,Y=(1-u)**2*P0.y+2*(1-u)*u*CP.y+u*u*P1.y;x.lineTo(X,Y)}x.stroke();x.setLineDash([]);
  [[P0,'PEKÍN'],[P1,'MADRID']].forEach(([p,n],i)=>{x.fillStyle=i?C.g:C.a;x.beginPath();x.arc(p.x,p.y,18+4*Math.sin(t*6),0,7);x.fill();txt(n,p.x,p.y+60,800,46,'#fff')});
  const u=k,X=(1-u)**2*P0.x+2*(1-u)*u*CP.x+u*u*P1.x,Y=(1-u)**2*P0.y+2*(1-u)*u*CP.y+u*u*P1.y;
  const dx=-2*(1-u)*P0.x+2*(1-2*u)*CP.x+2*u*P1.x,dy=-2*(1-u)*P0.y+2*(1-2*u)*CP.y+2*u*P1.y;plane(X,Y,Math.atan2(dy,dx),70);
  txt('Más de 9.000 km',W/2,1080,900,80,'#fff',cl((lt-0.5)/0.4));
  clock(W/2-170,1300,90,lt,C.r);txt('5 h de',W/2+110,1265,900,70,C.r,cl((lt-1)/0.3));txt('retraso',W/2+110,1340,900,70,C.r,cl((lt-1)/0.3));
  x.restore()}
 // ---- Scene 3: 7.4-11.8 EU airline -> 2.400
 A=fadeScene(t,7.4,11.8);
 if(A>0){const lt=t-7.4;x.save();x.globalAlpha=A;
  const sl=eo(lt/0.5);x.translate((1-sl)*-600,0);
  txt('Si volabais con una',W/2,330,800,62,'#fff');txt('aerolínea EUROPEA',W/2,410,900,76,C.g);
  eustars(W/2,660,150,t);plane(W/2,660,-0.3,70);
  x.restore();x.save();x.globalAlpha=A;
  const v=Math.round(2400*eo((lt-1.0)/1.6)/10)*10;const sc=1+0.08*Math.sin(cl((lt-2.6)/0.4)*Math.PI);
  x.save();x.translate(W/2,1000);x.scale(sc,sc);txt(String(v).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' €',0,0,900,190,C.g,cl((lt-0.9)/0.2));x.restore();
  txt('600 € × 4 personas',W/2,1150,700,52,'#fff',cl((lt-1.2)/0.3));
  for(let i=0;i<26;i++){const st=1.0+rnd(i)*2.2;if(lt>st){const y=lerp(-80,1550,cl((lt-st)/1.1)**1.6)+rnd(i+4)*0;coin(80+rnd(i+11)*920,Math.min(y,1500-rnd(i+2)*60),34,lt*8+i,1)}}
  x.restore()}
 // ---- Scene 4: 11.8-15.8 non-EU -> 0
 A=fadeScene(t,11.8,15.8);
 if(A>0){const lt=t-11.8;x.save();x.globalAlpha=A;
  const sl=eo(lt/0.5);x.translate((1-sl)*600,0);
  txt('Si volabais con una aerolínea',W/2,330,800,58,'#fff');txt('de FUERA de la UE',W/2,410,900,76,C.r);
  plane(W/2,640,-0.3,90);x.restore();x.save();x.globalAlpha=A;
  for(let i=0;i<14;i++){if(lt>1.1){const k=cl((lt-1.1)/1.0);coin(W/2+(rnd(i)-0.5)*900*k,1000+(rnd(i+5)-0.3)*900*k+700*k*k,30,i,(1-k)*0.8)}}
  if(lt<1.2){txt('2.400 €',W/2,1000,900,190,C.g,1-cl((lt-0.9)/0.3))}
  if(lt>1.0){const s=lerp(3.2,1,eo((lt-1.0)/0.25));const sh=lt<1.6?Math.sin(lt*90)*14*(1.6-lt):0;x.save();x.translate(W/2+sh,1000);x.scale(s,s);x.rotate(-0.08);
   x.strokeStyle=C.r;x.lineWidth=14;rr(-260,-130,520,260,30);x.stroke();txt('0 €',0,8,900,200,C.r);x.restore()}
  txt('El reglamento europeo no cubre',W/2,1260,600,46,'#fff',cl((lt-1.8)/0.4));
  txt('vuelos que llegan a la UE con',W/2,1320,600,46,'#fff',cl((lt-1.8)/0.4));
  txt('aerolíneas de fuera de la UE',W/2,1380,600,46,'#fff',cl((lt-1.8)/0.4));
  x.restore()}
 // ---- Scene 5: 15.8-21 punchline
 A=fadeScene(t,15.8,99);
 if(A>0){const lt=t-15.8;x.save();x.globalAlpha=A;
  const s1=eb(lt/0.4);x.save();x.translate(W/2,420);x.scale(s1,s1);txt('Mismo vuelo.',0,-50,900,92,'#fff');txt('Mismo retraso.',0,60,900,92,'#fff');x.restore();
  txt('Lo que cuenta es',W/2,700,800,64,C.a,cl((lt-0.8)/0.3));txt('quién OPERÓ el vuelo',W/2,790,900,72,C.a,cl((lt-0.8)/0.3));
  const u=eo((lt-1.2)/0.5);x.fillStyle=C.a;x.fillRect(W/2-360,840,720*u,10);
  const bs=1+0.05*Math.sin(t*6)*cl(lt-2);x.save();x.translate(W/2,1120);x.scale(bs*eb((lt-1.8)/0.4),bs*eb((lt-1.8)/0.4));x.fillStyle=C.g;rr(-390,-80,780,160,40);x.fill();txt('Compruébalo gratis →',0,4,900,64,'#fff');x.restore();
  txt('Calculadora gratuita en vuelosclaim.eu',W/2,1270,600,44,C.m,cl((lt-2.2)/0.3));
  x.restore()}
 if(t>0.6)pill(t);
}
window.render=render;
</script></body></html>
