name: Validar

# Se ejecuta en cada PR y en cada cambio de main. No publica nada:
# GitHub Pages publica la carpeta docs/ de main cuando se fusiona un PR.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preparar_docs:
    if: github.event_name == 'pull_request' && github.head_ref == 'revision-it-de-navegador-20261102'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revision-it-de-navegador-20261102
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sincronizar HTML
        run: |
          python3 fuente/build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "Regenerar docs para IT/DE"
            git push origin HEAD:revision-it-de-navegador-20261102
          fi
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generar la web desde fuente/
        run: python3 fuente/build.py

      - name: docs/ coincide con el código fuente
        run: |
          if [ -n "$(git status --porcelain -- docs)" ]; then
            echo "docs/ no coincide con lo que genera fuente/build.py. Ejecuta 'python3 fuente/build.py' y sube el resultado:"
            git status --porcelain -- docs | head -50
            exit 1
          fi

      - name: Motor de reglas de la calculadora
        run: node fuente/tests/test_reglas.js

      - name: Motor contra un oráculo independiente
        run: node fuente/tests/test_oraculo.js

      - name: Calculadora en italiano y alemán
        run: node fuente/tests/test_idiomas.js

      - name: Verificación de instrucciones IT/DE
        run: python3 fuente/tests/test_localizacion.py

      - name: Enlaces, SEO y datos
        run: python3 fuente/tests/test_sitio.py docs

      - name: Coherencia y mantenimiento del calendario de huelgas
        run: python3 fuente/tests/test_mantenimiento.py

      - name: URLs de reclamación sin destinos internos ni credenciales
        run: python3 fuente/tests/test_canales_seguridad.py

      - name: Enlaces de afiliación y seguimiento de conversiones
        run: python3 fuente/tests/test_monetizacion.py

  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Ejecutar pruebas de navegador
        run: |
          python3 -m http.server 8765 -d docs > /tmp/vuelosclaim-http.log 2>&1 &
          node fuente/tests/test_navegador.js
