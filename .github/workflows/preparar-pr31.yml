name: Preparar docs PR31
on:
  push:
    branches: [auditoria-wizard-i18n-20261102]
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auditoria-wizard-i18n-20261102
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Regenerar docs
        run: python3 fuente/build.py
      - name: Probar motor juridico
        run: |
          node fuente/tests/test_reglas.js
          node fuente/tests/test_oraculo.js
          node fuente/tests/test_idiomas.js
          python3 fuente/tests/test_sitio.py docs
          python3 fuente/tests/test_mantenimiento.py
          python3 fuente/tests/test_canales_seguridad.py
          python3 fuente/tests/test_monetizacion.py
      - name: Actualizar documentos generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "Regenerar docs para auditoria del asistente"
            git push origin HEAD:auditoria-wizard-i18n-20261102
          fi
